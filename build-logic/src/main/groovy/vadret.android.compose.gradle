pluginManager.apply('org.jetbrains.kotlin.plugin.compose')

def libs = extensions.getByType(VersionCatalogsExtension).named('libs')

android {
    buildFeatures {
        compose = true
    }
}

composeCompiler {
    reportsDestination = layout.buildDirectory.dir('compose_compiler')
    metricsDestination = layout.buildDirectory.dir('compose_compiler')
}

dependencies {
    [
        'compose-material3',
        'multiplatform-compose-foundation',
        'multiplatform-compose-ui',
        'multiplatform-compose-ui-tooling-preview',
        'lifecycle-runtime-compose',
        'lifecycle-viewmodel-compose',
    ].each { implementation libs.findLibrary(it).get() }
    debugImplementation libs.findLibrary('multiplatform-compose-ui-tooling').get()
}
