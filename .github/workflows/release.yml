name: Vädret Android App

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2
      - name: Write the signing keystore
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          echo "${KEYSTORE_FILE_BASE64}" | base64 --decode > .keystore
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17
      - name: Write the Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "${GOOGLE_SERVICES_JSON}" | base64 --decode > androidApp/src/github/google-services.json
      - name: Assemble release
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew assembleGithubRelease
      - name: Create release with one APK per CPU type
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" androidApp/build/outputs/apk/github/release/*.apk \
            --title "${GITHUB_REF_NAME}" \
            --notes "${GITHUB_REF_NAME}"
