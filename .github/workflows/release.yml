name: Vädret Android App

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2
      - run: |
          echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" > keystore.asc
          gpg -d --passphrase "${{ secrets.KEYSTORE_FILE_DECRYPT_PASSWORD }}" --batch keystore.asc > .keystore
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17
      - name: Assemble release
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          ./gradlew assembleGithubRelease \
            -Pvadret.firebase.applicationId="$FIREBASE_APPLICATION_ID" \
            -Pvadret.firebase.apiKey="$FIREBASE_API_KEY" \
            -Pvadret.firebase.senderId="$FIREBASE_SENDER_ID" \
            -Pvadret.firebase.projectId="$FIREBASE_PROJECT_ID"
      - name: Create release with one APK per CPU type
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" androidApp/build/outputs/apk/github/release/*.apk \
            --title "${GITHUB_REF_NAME}" \
            --notes "${GITHUB_REF_NAME}"
