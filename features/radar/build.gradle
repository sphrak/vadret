import org.jetbrains.kotlin.gradle.plugin.KotlinPlatformType

plugins {
    id 'vadret.kmp.feature'
}

def radarMaps = ['maplibreCompose', 'mapView']
def radarMap = providers.gradleProperty('vadret.radarMap').get()
if (!radarMaps.contains(radarMap)) {
    throw new GradleException("vadret.radarMap must be one of $radarMaps but was $radarMap")
}
def isMapView = radarMap == 'mapView'

kotlin {
    applyDefaultHierarchyTemplate {
        it.common {
            it.group('maplibreCompose') {
                it.withIos()
                if (!isMapView) {
                    it.withCompilations { compilation -> compilation.platformType == KotlinPlatformType.androidJvm }
                }
            }
        }
    }
    android {
        namespace = 'se.vadretapp.vadret.radar'
    }
    sourceSets {
        commonMain {
            dependencies {
                implementation project(':core:refresh')
                implementation project(':core:logging')
                implementation project(':data:common')
                implementation project(':data:location')
                implementation project(':data:pollen')
                implementation project(':data:pollenpreference')
                implementation project(':data:radar')
                implementation project(':data:wind')
                implementation project(':domain:pollenseason')
                implementation project(':ui:icons')

                implementation libs.coil.core
                implementation libs.either
                implementation libs.koin.core
                implementation libs.kotlinx.collections.immutable
                implementation libs.kotlinx.datetime
                implementation libs.kotlinx.io.core
                implementation libs.ktor.client.core
                implementation libs.okio
            }
        }
        maplibreComposeMain {
            dependencies {
                implementation libs.maplibre.compose
                implementation libs.kotlinx.serialization.json
            }
        }
        androidMain {
            if (isMapView) {
                kotlin.srcDir('src/androidMapView/kotlin')
            }
            dependencies {
                implementation libs.androidx.core.ktx
                implementation libs.compose.material3
                if (isMapView) {
                    implementation libs.maplibre.android
                } else {
                    runtimeOnly libs.maplibre.compose.runtime.opengl
                }
            }
        }
        androidHostTest {
            if (isMapView) {
                kotlin.srcDir('src/androidMapViewHostTest/kotlin')
            }
        }
        commonTest {
            dependencies {
                implementation project(':core:testing')
            }
        }
    }
}
