plugins {
    id 'com.android.application'
    id 'kotlinx-serialization'
    id 'vadret.android.compose'
}

def static loadFromEnvironment(String key) {
    return System.getenv(key)
}

def static loadFromFile(String key, String value) {
    def properties = new Properties()
    def loadedFile = new File(value)
    if (loadedFile.canRead()) {
        properties.load(new FileInputStream(value))
        return properties[key]
    } else {
        return "INVALID_KEY"
    }
}

def isRunningOnCI = System.getenv("CI") == "true"

def firebaseResValue = { String propertyName ->
    providers.gradleProperty(propertyName).orElse("").map { value -> new com.android.build.api.variant.ResValue(value, null) }
}
def firebaseResValues = [
    "google_app_id"      : "vadret.firebase.applicationId",
    "google_api_key"     : "vadret.firebase.apiKey",
    "gcm_defaultSenderId": "vadret.firebase.senderId",
    "project_id"         : "vadret.firebase.projectId"
]

def appVersionCode = 31
def abiVersionCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 4]

def getGitSha = { ->
    return providers.exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
    }.standardOutput.asText.get().trim()
}

android {

    namespace = "fi.kroon.vadret"
    compileSdk {
        version = release(libs.versions.android.compileSdk.get().toInteger()) {
            minorApiLevel = libs.versions.android.compileSdkMinor.get().toInteger()
        }
    }
    defaultConfig {
        applicationId = "fi.kroon.vadret"
        minSdk = libs.versions.android.minSdk.get().toInteger()
        targetSdk = libs.versions.android.targetSdk.get().toInteger()
        versionCode = appVersionCode
        versionName = "3.3.0alpha01"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner = "androidx.top.runner.AndroidJUnitRunner"
        multiDexEnabled = true
    }
    signingConfigs {
        release {
            keyAlias
            keyPassword
            storeFile
            storePassword
        }
    }
    if (isRunningOnCI) {
        signingConfigs.release.storeFile = file("../.keystore")
        signingConfigs.release.storePassword = loadFromEnvironment("KEY_STORE_PASSWORD")
        signingConfigs.release.keyAlias = loadFromEnvironment("KEY_ALIAS")
        signingConfigs.release.keyPassword = loadFromEnvironment("KEY_PASSWORD")
    } else {
        signingConfigs.release.storeFile = file("../.keystore")
        signingConfigs.release.storePassword = loadFromFile("storePassword", "keystore.properties")
        signingConfigs.release.keyAlias = loadFromFile("keyAlias", "keystore.properties")
        signingConfigs.release.keyPassword = loadFromFile("keyPassword", "keystore.properties")
    }
    splits {
        abi {
            enable = true
            reset()
            include(*abiVersionCodes.keySet().toList())
            universalApk = false
        }
    }
    packaging {
        resources {
            excludes += [
                'META-INF/NOTICE',
                'META-INF/LICENSE',
                'META-INF/notice',
                'META-INF/notice.txt',
                'META-INF/license',
                'META-INF/license.txt'
            ]
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            buildConfigField "String", "APP_VERSION", "\"${defaultConfig.versionName}\""
            buildConfigField "boolean", "IS_DEVELOPER_BUILD", "false"
        }
        localRelease {
            initWith release
            signingConfig = signingConfigs.debug
            matchingFallbacks = ['release']
            buildConfigField "boolean", "IS_DEVELOPER_BUILD", "true"
        }
        debug {
            enableAndroidTestCoverage = true
            versionNameSuffix = "debug"
            buildConfigField "String", "APP_VERSION", "\"${defaultConfig.versionName}-${versionNameSuffix}-${getGitSha}\""
            buildConfigField "boolean", "IS_DEVELOPER_BUILD", "true"
        }
    }
    flavorDimensions = ["default"]
    productFlavors {
        fdroid {}
        github {
            signingConfig = signingConfigs.release
            versionNameSuffix = "signed"
            buildConfigField "String", "APP_VERSION", "\"${defaultConfig.versionName}-${getGitSha}-${versionNameSuffix}\""
        }
    }
    lint {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
        resValues = true
    }
}

kotlin {
    compilerOptions {
        optIn.add('kotlin.concurrent.atomics.ExperimentalAtomicApi')
        freeCompilerArgs.addAll('-Xfull-value-classes', '-Xcompanion-blocks-and-extensions')
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.flavorName == "github") {
            firebaseResValues.each { resourceName, propertyName ->
                variant.resValues.put(variant.makeResValueKey("string", resourceName), firebaseResValue(propertyName))
            }
        }
        variant.outputs.each { output ->
            def abi = output.filters.find { filter -> filter.filterType == com.android.build.api.variant.FilterConfiguration.FilterType.ABI }?.identifier
            if (abi != null) {
                output.versionCode.set(appVersionCode * 10 + abiVersionCodes[abi])
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation project(':core')
    implementation project(':core:logging')
    implementation project(':data:common')
    implementation project(':data:location')
    implementation project(':data:theme')
    implementation project(':features:forecastwarning')
    implementation project(':features:radar')
    implementation project(':features:settings')
    implementation project(':features:weatherforecast')
    implementation project(':shared')

    // Android
    implementation libs.androidx.activity.compose
    implementation libs.coroutines.core
    implementation libs.either
    implementation libs.kotlinx.serialization.json
    implementation libs.ktor.client.core

    // Dependency Injection
    implementation libs.koin.core

    githubImplementation project(':core:encryption')
    githubImplementation project(':data:pushalert')
    githubImplementation project(':features:pushalert')
    githubImplementation libs.androidx.core.ktx
    githubImplementation libs.firebase.messaging

    // Debugging, Testing, Linting, Analytics
    debugImplementation libs.leakcanary
    testImplementation project(':core:testing')
    testImplementation libs.coroutines.test
    testImplementation libs.kotlin.test
    testImplementation libs.kotlin.test.junit
    testImplementation libs.mockk
    testGithubImplementation project(':features:pushalert')
}

repositories {
    mavenCentral()
}

def missingFirebaseProperties = providers.provider {
    firebaseResValues.values().findAll { propertyName -> providers.gradleProperty(propertyName).getOrElse("").isBlank() }
}
def checkFirebaseConfiguration = tasks.register("checkFirebaseConfiguration") {
    def missing = missingFirebaseProperties
    doLast {
        if (!missing.get().isEmpty()) {
            throw new GradleException("A GitHub release needs the Gradle properties ${missing.get().join(", ")} from the Firebase console")
        }
    }
}
tasks.matching { task -> task.name == "packageGithubRelease" }.configureEach { task -> task.dependsOn(checkFirebaseConfiguration) }

tasks.named("check") {
    dependsOn ":ktlint"
}
